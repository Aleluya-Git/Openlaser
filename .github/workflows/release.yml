name: Release

# Al subir una etiqueta vX.Y.Z se prueban y empaquetan el instalador de Windows y la versión portable,
# y se publican en una release de GitHub. / Pushing a vX.Y.Z tag builds and publishes the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10"
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Tests
        run: python -m pytest -q
      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/openlaser.spec
      - name: Smoke test of the executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\OpenLaserStudio\OpenLaserStudio.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "The executable exited with code $($p.ExitCode)" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\OpenLaserStudio\* -DestinationPath "dist\OpenLaserStudio-${{ steps.ver.outputs.version }}-portable-win64.zip"
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe, dist\*.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File -Encoding ascii dist\SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: OpenLaser Studio ${{ steps.ver.outputs.version }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/OpenLaserStudio-*-setup.exe
            dist/OpenLaserStudio-*-portable-win64.zip
            dist/SHA256SUMS.txt
