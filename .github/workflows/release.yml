name: Release

# Publica la release vX.Y.Z (versión de pyproject.toml) cuando cambia la versión en main, al subir una
# etiqueta vX.Y.Z o a mano (Actions → Release → Run workflow). Si la release ya existe, no hace nada.
# Publishes release vX.Y.Z (version from pyproject.toml) when the version changes on main, on a vX.Y.Z tag
# push or manually. Does nothing if that release already exists.
on:
  push:
    branches: [main]
    paths: [pyproject.toml, .github/workflows/release.yml]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10"
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "Release v$v already exists" }
          else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tests
        if: steps.ver.outputs.exists != 'true'
        run: python -m pytest -q
      - name: PyInstaller
        if: steps.ver.outputs.exists != 'true'
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/openlaser.spec
      - name: Smoke test of the executable
        if: steps.ver.outputs.exists != 'true'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\OpenLaserStudio\OpenLaserStudio.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "The executable exited with code $($p.ExitCode)" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
      - name: Inno Setup
        if: steps.ver.outputs.exists != 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Portable ZIP
        if: steps.ver.outputs.exists != 'true'
        shell: pwsh
        run: Compress-Archive -Path dist\OpenLaserStudio\* -DestinationPath "dist\OpenLaserStudio-${{ steps.ver.outputs.version }}-portable-win64.zip"
      - name: Checksums
        if: steps.ver.outputs.exists != 'true'
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe, dist\*.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File -Encoding ascii dist\SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.exists != 'true'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OpenLaser Studio ${{ steps.ver.outputs.version }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/OpenLaserStudio-*-setup.exe
            dist/OpenLaserStudio-*-portable-win64.zip
            dist/SHA256SUMS.txt
